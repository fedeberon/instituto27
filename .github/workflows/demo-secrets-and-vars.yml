name: Demo Secrets & Vars

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-secrets-and-vars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db_smoke_test:
    name: DB smoke test (uses Environment secrets)
    runs-on: ubuntu-latest
    environment: staging   # <- usa los secrets del Environment "staging"
    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        # Para servicios, seteamos credenciales desde secrets:
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: appdb
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd="pg_isready -U $${POSTGRES_USER}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: appdb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h "$PGHOST" -p "$PGPORT" && exit 0
            sleep 2
          done
          echo "Postgres not ready" && exit 1

      - name: Install psql
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Run simple SQL using secrets (no logs of credentials)
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          psql -h "$PGHOST" -U "$DB_USER" -d "$PGDATABASE" -c "CREATE TABLE IF NOT EXISTS ping(id serial primary key, ts timestamptz default now());"
          psql -h "$PGHOST" -U "$DB_USER" -d "$PGDATABASE" -c "INSERT INTO ping DEFAULT VALUES;"
          psql -h "$PGHOST" -U "$DB_USER" -d "$PGDATABASE" -c "SELECT count(*) AS rows_in_ping FROM ping;"

  print_vars:
    name: Print plain variables (repo/env vars)
    runs-on: ubuntu-latest
    # Opcional: si querés que también lea vars del mismo Environment:
    environment: staging
    env:
      APP_NAME: ${{ vars.APP_NAME }}              # ej: "Service Provider Portal"
      DEFAULT_REGION: ${{ vars.DEFAULT_REGION }}  # ej: "us-east-1"
      FEATURE_FLAG_X: ${{ vars.FEATURE_FLAG_X }}  # ej: "true"
    steps:
      - name: Show plain repo/env variables
        run: |
          echo "App: ${APP_NAME}"
          echo "Region: ${DEFAULT_REGION}"
          echo "Feature X enabled: ${FEATURE_FLAG_X}"
          # Nota: los secrets NUNCA se imprimen; para diferenciar:
          if [ -z "${{ secrets.DB_USER }}" ]; then
            echo "DB_USER secret is NOT set in this environment"
          else
            echo "DB_USER secret is present (value is masked)"
          fi